    image: pqch-agency/api
    paths: [/etc/nginx/tls/partner-ca.crt]
    asset: {type: certificate, name: ECDSA}
    parameters: {curve: P-256, kind: certificate-authority}
    verifiable_by: none
  - id: api-partners-client-certificates
    class: out-of-reach
    layer: wire
    subject: {host: 172.16.106.11, port: 8443, direction: inbound-client}
    asset: {type: certificate, role: signature, name: ECDSA}
    parameters: {curve: P-256, kind: client-certificate-authority}
    why: >-
      The listener demands a client certificate chaining to the partner CA
      (P-256); the handshake names that CA to any client. Which key each
      partner actually presents — its algorithm and size — is in the partner's
      half of the handshake, which no probe from this side can see; passive
      capture beside the listener would show it (M1, traffic generator).
    verifiable_by: none
    trace: {path: agency/api/nginx.conf, contains: ssl_verify_client}

