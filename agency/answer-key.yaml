  - id: legacy-app-keystore-file
    class: present
    layer: host
    image: pqch-agency/legacy-app
    paths: [/usr/local/tomcat/conf/keystore.p12]
    asset: {type: related-crypto-material, name: RSA}
    parameters: {kind: keystore, format: PKCS12, key_bits: 2048, holds: [private-key, certificate, ca-certificate]}
    # The password is in server.xml ("changeit"); a scanner that cannot open
    # the store still sees a PKCS#12 file and should say so.
    verifiable_by: none
  - id: legacy-app-decoy-rsa-key-transport
    class: decoy
    layer: wire
    subject: {host: 172.16.106.32, port: 8443, protocol: tls}
    asset: {role: key-establishment, name: RSA}
    why: >-
      An RSA certificate on a TLS 1.2-only Java listener is the picture of RSA
      key transport; its ciphers attribute allows two ECDHE-RSA suites and no
      other, so a client offering only TLS_RSA_WITH_* suites is refused
      (observed 2026-10-19 with OpenSSL 3.5, s_client -tls1_2 -cipher kRSA).
      An inventory that infers key transport from the certificate and the
      protocol version has invented it; records-db, with the same certificate
      type, is where it is real.
    verifiable_by: wire-kex
    trace: {path: agency/legacy-app/server.xml, contains: ciphers=}
  - id: legacy-app-decoy-retired-connector
    class: decoy
    layer: code
    path: agency/legacy-app/server.xml
    contains: TLS_RSA_WITH_3DES_EDE_CBC_SHA
    asset: {role: key-establishment, name: RSA}
    why: Inside an XML comment; the keystore it names is not in the image and nothing listens on 8444.
    verifiable_by: none
