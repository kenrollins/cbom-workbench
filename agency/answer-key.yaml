  # ------------------------------------------------------------ records-db
  # TLS after PostgreSQL's SSLRequest upgrade: a scanner has to speak the
  # upgrade (testssl.sh --starttls postgres) or it sees nothing.
  - id: records-kex-x25519mlkem768
    class: present
    layer: wire
    subject: {host: 172.16.106.30, port: 5432, protocol: postgres}
    asset: {role: key-establishment, name: X25519MLKEM768}
    verifiable_by: wire-kex
    trace: {path: agency/records-db/postgresql.conf, contains: ssl_groups}
  - id: records-kex-x25519
    class: present
    layer: wire
    subject: {host: 172.16.106.30, port: 5432, protocol: postgres}
    asset: {role: key-establishment, name: X25519}
    verifiable_by: wire-kex
    trace: {path: agency/records-db/postgresql.conf, contains: ssl_groups}
  - id: records-kex-dh-2048
    class: present
    layer: wire
    subject: {host: 172.16.106.30, port: 5432, protocol: postgres}
    asset: {role: key-establishment, name: DH-2048}
    parameters: {tool_names: [RFC3526/Oakley Group 14]}
    # Added 2026-10-19, after the four items beside it: a hand run of testssl.sh
    # through the upgrade showed the TLS 1.2 DHE suites, which PostgreSQL serves
    # with its built-in 2048-bit group (RFC 3526 group 14) when no
    # ssl_dh_params_file is set. The s_client probes that wrote the first four
    # items had not offered a DHE suite. Finite-field key establishment with no
    # group in the list of groups the configuration names.
    verifiable_by: wire-kex
    # No live line sets the group: ssl_dh_params_file is commented out, so the
    # server's built-in parameters apply. The key first named that commented
    # line as the cause; the investigator's trace of 2026-10-20 said default and
    # was right (lesson 31).
    trace: {cause: default}
  - id: records-kex-rsa-key-transport
    class: present
    layer: wire
    subject: {host: 172.16.106.30, port: 5432, protocol: postgres}
    asset: {role: key-establishment, name: RSA}
    parameters: {mode: key-transport, tls_versions: [TLSv1.2]}
    why: >-
      ssl_ciphers is left at PostgreSQL's default, which keeps the TLS 1.2
      TLS_RSA_WITH_* suites; a client offering only those connects
      (AES256-GCM-SHA384, observed 2026-10-19 with OpenSSL 3.5, s_client
      -starttls postgres -tls1_2 -cipher kRSA). Key establishment with no
      group: absent from every list of groups, present in the cipher list.
      The configured groups say "hybrid first"; this says the server's RSA key
      can still carry the session secret.
    verifiable_by: wire-kex
    trace: {path: agency/records-db/postgresql.conf, contains: ssl_ciphers}
  - id: records-cert
    class: present
    layer: wire
    subject: {host: 172.16.106.30, port: 5432, protocol: postgres}
    asset: {type: certificate, role: signature, name: RSA}
    parameters: {key_bits: 2048, signature: ecdsa-with-SHA384, self_signed: false, issuer: Mini Agency Internal CA}
    verifiable_by: cert-parse
    trace: {path: agency/pki/Dockerfile, contains: "rsa:2048"}
  - id: records-cert-file
    class: present
    layer: host
    image: pqch-agency/records-db
    paths: [/etc/pg-tls/server.crt]
    asset: {type: certificate, name: RSA}
    verifiable_by: none
  - id: records-key-file
    class: present
    layer: host
    image: pqch-agency/records-db
    paths: [/etc/pg-tls/server.key]
    asset: {type: related-crypto-material, name: RSA}
    parameters: {key_bits: 2048, kind: private-key}
    verifiable_by: none
  - id: records-ca-file
    class: present
    layer: host
