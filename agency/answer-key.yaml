  # ----------------------------------------------------- api, partners (8443)
  # The same certificate and groups as 443; a client certificate from the
  # partner CA is required. Groups and certificate are visible from the
  # outside (spike S2, C7); what the partners present is not.
  - id: api-partners-kex-x25519mlkem768
    class: present
    layer: wire
    subject: {host: 172.16.106.11, port: 8443, protocol: tls}
    asset: {role: key-establishment, name: X25519MLKEM768}
    verifiable_by: wire-kex
    trace: {path: agency/api/nginx.conf, contains: ssl_ecdh_curve}
  - id: api-partners-kex-x25519
    class: present
    layer: wire
    subject: {host: 172.16.106.11, port: 8443, protocol: tls}
    asset: {role: key-establishment, name: X25519}
    verifiable_by: wire-kex
    trace: {path: agency/api/nginx.conf, contains: ssl_ecdh_curve}
  - id: api-partners-cert
    class: present
    layer: wire
    subject: {host: 172.16.106.11, port: 8443, protocol: tls}
    asset: {type: certificate, role: signature, name: ECDSA}
    parameters: {curve: P-256, signature: ecdsa-with-SHA256, self_signed: true}
    verifiable_by: cert-parse
