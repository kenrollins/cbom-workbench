worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 64; }

http {
    access_log off;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name pq-gateway.agency.test;

        ssl_certificate     /etc/nginx/tls/pq-gateway.crt;
        ssl_certificate_key /etc/nginx/tls/pq-gateway.key;
        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768;
        # ssl_ecdh_curve X25519MLKEM768:X25519;   # the pilot's fallback, withdrawn

        location / { return 200 "pq-gateway\n"; }
    }
}
