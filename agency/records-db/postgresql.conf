# records-db — PostgreSQL 18. The TLS settings are the ones a wire finding is
# traced to; everything else is the minimum for a 256 MB container.
listen_addresses = '*'
port = 5432
max_connections = 20
shared_buffers = 32MB
dynamic_shared_memory_type = posix
log_min_messages = warning
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# ---- TLS
ssl = on
ssl_cert_file = '/etc/pg-tls/server.crt'
ssl_key_file = '/etc/pg-tls/server.key'
ssl_ca_file = '/etc/pg-tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
ssl_groups = 'X25519MLKEM768:X25519'
# ssl_ciphers is the server default, 'HIGH:MEDIUM:+3DES:!aNULL', which keeps the
# TLS 1.2 RSA key-transport suites (TLS_RSA_WITH_*) enabled.
# ssl_dh_params_file = '/etc/pg-tls/dh1024.pem'

# ---- Policy
# The central crypto policy's settings for this listener, proposed, approved and applied by
# the runner; mounted from agency/generated/records-db/. Read last, so a setting here takes
# precedence over the same setting above: PostgreSQL uses the last value it reads.
include_if_exists '/etc/pg/policy/tls.conf'
