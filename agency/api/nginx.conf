worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 64; }

http {
    access_log off;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name api.agency.test;

        ssl_certificate     /etc/nginx/tls/api.crt;
        ssl_certificate_key /etc/nginx/tls/api.key;
        # Key establishment from the central crypto policy, as the portal's: the runner rewrites it
        # only to apply an approved change. Both listeners share it, and so move together.
        include /etc/nginx/policy/tls.conf;

        location / { return 200 "api\n"; }
    }

    # Partners: the same certificate and groups, and a client certificate from
    # the partner CA is required. What the partners present is not visible from
    # this side of the connection.
    server {
        listen 8443 ssl;
        server_name api.agency.test;

        ssl_certificate     /etc/nginx/tls/api.crt;
        ssl_certificate_key /etc/nginx/tls/api.key;
        # Key establishment from the central crypto policy, as the portal's: the runner rewrites it
        # only to apply an approved change. Both listeners share it, and so move together.
        include /etc/nginx/policy/tls.conf;
        ssl_client_certificate /etc/nginx/tls/partner-ca.crt;
        ssl_verify_client on;

        location / { return 200 "partners\n"; }
    }
}
