worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 64; }

http {
    access_log off;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name portal.agency.test;

        ssl_certificate     /etc/nginx/tls/portal.crt;
        ssl_certificate_key /etc/nginx/tls/portal.key;
        # Protocol versions and key-exchange groups come from the central crypto
        # policy (policy/crypto-policy.yaml), rendered into this file.
        include /etc/nginx/policy/tls.conf;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        # ssl_dhparam /etc/nginx/tls/dh1024.pem;

        location / { return 200 "portal\n"; }
    }
}
