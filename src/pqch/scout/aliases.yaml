# Tool spellings to standard names, as data: `pqch.alias-pack/1`.
#
# Every scanner spells an algorithm its own way (testssl.sh says prime256v1, OpenSSH says
# ecdh-sha2-nistp256, a capture sees the IANA group id 23, an imported CBOM says P-256). The
# normalizer maps each spelling to one standard name through these tables and nothing else, so
# two tools' findings about one algorithm fold onto one CBOM entry. A spelling no table knows
# passes through unchanged and shows up as an entry of its own, which is how a missing alias is
# found. A change to a table is a change to this file with `version` raised; a run records the
# version and the file's hash in `run.started`, so an inventory says which table named it.
#
# Standard names are the answer key's (agency/answer-key.yaml, "Names"): IANA's TLS group names,
# FIPS names for the post-quantum algorithms (ML-KEM-768), and the hybrid names of the TLS
# drafts. Group ids are IANA TLS Supported Groups; a draft or vendor id is named by its draft.
schema: pqch.alias-pack/1
version: 1
dated: '2026-11-09'
