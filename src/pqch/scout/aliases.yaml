# Tool spellings to standard names, as data: `pqch.alias-pack/1`.
#
# Every scanner spells an algorithm its own way (testssl.sh says prime256v1, OpenSSH says
# ecdh-sha2-nistp256, a capture sees the IANA group id 23, an imported CBOM says P-256). The
# normalizer maps each spelling to one standard name through these tables and nothing else, so
# two tools' findings about one algorithm fold onto one CBOM entry. A spelling no table knows
# passes through unchanged and shows up as an entry of its own, which is how a missing alias is
# found. A change to a table is a change to this file with `version` raised; a run records the
# version and the file's hash in `run.started`, so an inventory says which table named it.
#
# Standard names are the answer key's (agency/answer-key.yaml, "Names"): IANA's TLS group names,
# FIPS names for the post-quantum algorithms (ML-KEM-768), and the hybrid names of the TLS
# drafts. Group ids are IANA TLS Supported Groups; a draft or vendor id is named by its draft.
#
# Version 2 (2026-11-21): group 25498 is SecP256r1Kyber768Draft00 (it was misnamed
# X25519Kyber512Draft00, which only ever had the private-use id 65072); curveSM2 (41),
# curveSM2MLKEM768 (4590) and the three private-use Kyber draft ids (65072-65074) are named;
# `tls_version_names` holds every tool's spelling of a protocol version (testssl.sh's TLSv1, Zeek's
# TLSv13); `ssh_kex_ignore` holds the negotiation markers SSH lists among its key exchanges; and
# `pq_key_establishment` is the one list of which standard names are post-quantum or hybrid, for
# every rule that counts them.
#
# Checked 2026-11-22 (no mapping changed, so `version` stays 2): every id in `tls_group_ids` was
# read against IANA's TLS Supported Groups registry, held as policy/sources/iana-tls-supported-groups.csv
# (`source` below: URL, date read, sha256; the registry group states "Last Updated 2026-11-05").
# All 51 ids the registry names carry (48 on the day of the check, and the three version 3 adds) its name under this pack's convention: IANA's spelling,
# except the two Montgomery curves written X25519 and X448 (IANA: x25519, x448) and the FIPS names
# ML-KEM-512/768/1024 (IANA: MLKEM512/768/1024). The registry marks 25497 and 25498 "(OBSOLETE)",
# Recommended "D" (discouraged), obsoleted by RFC 10024; the pack keeps the bare name, since a
# capture still sees them. 1-8 and 15-21 are also Recommended "D" (RFC 9847). The three ids
# 65072-65074 lie in the registry's "Reserved for Private Use" range (65024-65279), which IANA
# does not name; they are named from Cloudflare's Go fork (`source.private_use`), which spells the
# last one P256Kyber768Draft00 and which this pack writes with IANA's name for the same
# construction at 25498. tests/test_aliases_sources.py holds the pack to the saved registry.
# Version 3 (2026-11-22) adds the three hybrid groups the registry names and version 2 did not hold,
# so a handshake on one is counted as post-quantum: 4585 SecP256r1MLKEM512, 4586 MLKEM512X25519,
# 4591 MLKEM1024X448. Registry-named ids this pack still does not hold, which pass through as
# `group-<id>`: 34-40 (GC256A to GC512C), 42-44 (bign-curve), 65281 and 65282 (arbitrary explicit curves).
