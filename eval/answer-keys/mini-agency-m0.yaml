# Posture per listener: how the key-establishment and authentication halves
# combine. Mixed entries are keyed as mixed.
#   classical — no post-quantum key establishment offered
#   mixed     — hybrid post-quantum key establishment offered, classical
#               authentication (certificate or host key)
#   pq        — post-quantum key establishment and post-quantum authentication
posture:
  - {host: 172.16.106.10, port: 443, protocol: tls, posture: classical}
  - {host: 172.16.106.11, port: 443, protocol: tls, posture: mixed}
  - {host: 172.16.106.20, port: 22, protocol: ssh, posture: classical}
  - {host: 172.16.106.21, port: 22, protocol: ssh, posture: mixed}
