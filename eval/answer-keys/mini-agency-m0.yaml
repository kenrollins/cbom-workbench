    image: pqch-agency/sftp-legacy
    paths: [/etc/ssh/ssh_host_ed25519_key, /etc/ssh/ssh_host_ed25519_key.pub]
    asset: {type: related-crypto-material, name: Ed25519}
    verifiable_by: none
  - id: legacy-client-kex-records-archive
    class: out-of-reach
    layer: wire
    subject: {host: 172.16.106.20, direction: outbound, peer: records-archive}
    asset: {role: key-establishment, name: DH-1024}
    parameters: {host_key_algorithms: [ssh-dss]}
    why: >-
      Client-side posture: what sftp-legacy offers when it connects out. No
      listener shows it; only passive capture beside the client would (M1).
    verifiable_by: none
    trace: {path: agency/sftp-legacy/ssh_config, contains: diffie-hellman-group1-sha1}

  # --------------------------------------------------------------- bastion
  - id: bastion-kex-x25519mlkem768
