  - id: legacy-kex-secp521r1
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: key-establishment, name: secp521r1}
    verifiable_by: wire-kex
    trace: {path: agency/sftp-legacy/sshd_config, contains: KexAlgorithms}
  - id: legacy-kex-dh-gex
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: key-establishment, name: DH-GEX}
    parameters: {ssh_names: [diffie-hellman-group-exchange-sha256, diffie-hellman-group-exchange-sha1]}
    verifiable_by: wire-kex
    trace: {path: agency/sftp-legacy/sshd_config, contains: KexAlgorithms}
  - id: legacy-kex-dh-2048
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: key-establishment, name: DH-2048}
    parameters: {ssh_names: [diffie-hellman-group14-sha1]}
    verifiable_by: wire-kex
    trace: {path: agency/sftp-legacy/sshd_config, contains: KexAlgorithms}
  - id: legacy-kex-dh-1024
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: key-establishment, name: DH-1024}
    parameters: {ssh_names: [diffie-hellman-group1-sha1]}
    verifiable_by: wire-kex
    trace: {path: agency/sftp-legacy/sshd_config, contains: KexAlgorithms}
  - id: legacy-hostkey-rsa
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: signature, name: RSA}
    parameters: {key_bits: 2048}
    verifiable_by: none
    trace: {path: agency/sftp-legacy/sshd_config, contains: ssh_host_rsa_key}
  - id: legacy-hostkey-dsa
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: signature, name: DSA}
    parameters: {key_bits: 1024}
    verifiable_by: none
    trace: {path: agency/sftp-legacy/sshd_config, contains: ssh_host_dsa_key}
  - id: legacy-hostkey-ecdsa
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: signature, name: ECDSA}
    parameters: {curve: P-256}
    verifiable_by: none
    trace: {path: agency/sftp-legacy/sshd_config, contains: ssh_host_ecdsa_key}
  - id: legacy-hostkey-ed25519
    class: present
    layer: wire
    subject: {host: 172.16.106.20, port: 22, protocol: ssh}
    asset: {role: signature, name: Ed25519}
    verifiable_by: none
    trace: {path: agency/sftp-legacy/sshd_config, contains: ssh_host_ed25519_key}
  - id: legacy-hostkey-rsa-file
    class: present
    layer: host
    image: pqch-agency/sftp-legacy
    paths: [/etc/ssh/ssh_host_rsa_key, /etc/ssh/ssh_host_rsa_key.pub]
    asset: {type: related-crypto-material, name: RSA}
    verifiable_by: none
  - id: legacy-hostkey-dsa-file
    class: present
    layer: host
    image: pqch-agency/sftp-legacy
    paths: [/etc/ssh/ssh_host_dsa_key, /etc/ssh/ssh_host_dsa_key.pub]
    asset: {type: related-crypto-material, name: DSA}
    verifiable_by: none
  - id: legacy-hostkey-ecdsa-file
    class: present
    layer: host
    image: pqch-agency/sftp-legacy
    paths: [/etc/ssh/ssh_host_ecdsa_key, /etc/ssh/ssh_host_ecdsa_key.pub]
    asset: {type: related-crypto-material, name: ECDSA}
    verifiable_by: none
  - id: legacy-hostkey-ed25519-file
    class: present
