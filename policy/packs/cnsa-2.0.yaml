# NSA's Commercial National Security Algorithm Suite 2.0, as data — NOT READ FIRST-HAND.
#
# NSA's site refused the download on 2026-10-05 and again on 2026-10-20 (HTTP 403 for both the
# FAQ and the advisory). The dates below are from secondary summaries that agree with one
# another; every entry is `verified: false`, and the assessor applies none of them as a
# deadline. The pack is here so the scope rule is real: CNSA 2.0 governs national security
# systems, M-26-15 does not (M-26-15 §3.B), and a service is placed under one or the other by
# the owner's `national_security_system` fact. No service of the mini-agency is one.
