# Which normalized algorithm names give post-quantum protection. Data, read by
# the posture rule (src/pqch/assessor). A hybrid counts as post-quantum key
# establishment: it holds if either of its parts holds.
#
# The deadlines, queues and the memo's table of quantum-vulnerable algorithms
# arrive with the M-26-15 and CNSA 2.0 policy packs (M2).
#
# `key_establishment` and `signature` hold only names a NIST standard defines
# (FIPS 203, 204, 205) or a hybrid with one: the names the M-26-15 pack calls
# resistant, through policy/algorithm-families.yaml. A listener's posture is
# `mixed` or `pq` on these alone.
key_establishment:
  - X25519MLKEM768
  - SecP256r1MLKEM768
  - SecP256r1MLKEM512
  - MLKEM512X25519
  - MLKEM1024X448
  - SecP384r1MLKEM1024
  - ML-KEM-512
  - ML-KEM-768
  - ML-KEM-1024
# Post-quantum by design, and not a NIST standard nor a hybrid with one: OpenSSH's
# Streamlined NTRU Prime hybrid. The posture rule reports it on its own line
# (`kex_pq_not_standardised`), neither as classical nor as the post-quantum key
# establishment a posture rests on: no pack names it (M-26-15 footnote 13; CNSA 2.0
# names ML-KEM-1024 only). Its family in algorithm-families.yaml is
# `pq-not-standardised`; tests/test_managed.py holds the two files to each other.
key_establishment_not_standardised:
  - sntrup761x25519
signature:
  - ML-DSA-44
  - ML-DSA-65
  - ML-DSA-87
  - SLH-DSA
