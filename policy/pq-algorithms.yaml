# Which normalized algorithm names give post-quantum protection. Data, read by
# the posture rule (src/pqch/assessor). A hybrid counts as post-quantum key
# establishment: it holds if either of its parts holds.
#
# The deadlines, queues and the memo's table of quantum-vulnerable algorithms
# arrive with the M-26-15 and CNSA 2.0 policy packs (M2).
key_establishment:
  - X25519MLKEM768
  - SecP256r1MLKEM768
  - SecP384r1MLKEM1024
  - ML-KEM-512
  - ML-KEM-768
  - ML-KEM-1024
  - sntrup761x25519
signature:
  - ML-DSA-44
  - ML-DSA-65
  - ML-DSA-87
  - SLH-DSA
