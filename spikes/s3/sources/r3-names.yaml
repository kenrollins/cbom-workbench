# R3's pool: algorithm names as a finding carries them, each with the family it belongs to and what
# settles that. 36 of these are drawn by seeded shuffle. Whether a family is quantum-vulnerable is not
# stated here: make_r123.py takes it from OMB M-26-15, Appendix A (sources/m-26-15-appendix-a.txt).
# Left out on purpose: names whose status that text does not settle — LMS and XMSS, sntrup761x25519,
# FALCON, HQC. (CNSA 2.0 would settle the first two; NSA's site refused the download on 2026-10-05,
# so it was not read first-hand and is not used.)
