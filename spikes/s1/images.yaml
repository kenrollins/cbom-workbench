# Every image the mini-agency and the harness plan to use, as of 2026-10-04.
# The service list follows BRIEF "Targets" (legacy bases, web, identity,
# database, messaging, Java, an internal certificate authority, hybrid
# endpoints) and the images the design review checked (01-findings F-15).
# role: target | harness | scanner | bundle
# digest: what the check reads. Where the repository already pins the image (a Dockerfile, the
#   runner's profiles, the bundle build) it is that pin; otherwise the digest the tag pointed at
#   when S1 read it. The tag is kept for people; a tag that has since moved is reported, not followed.
# build_time: true marks a lab-only tool that never runs on the GB10 and so needs no stand-in.
# gb10: true when the image is meant to run on one GB10.
