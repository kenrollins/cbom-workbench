# One KRaft node, an SSL listener on 9093, PEM key store. S2 only.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9094
listeners=SSL://:9093,CONTROLLER://:9094
advertised.listeners=SSL://172.16.106.44:9093
listener.security.protocol.map=SSL:SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=SSL
controller.listener.names=CONTROLLER
log.dirs=/tmp/kraft-logs
offsets.topic.replication.factor=1
ssl.keystore.type=PEM
ssl.keystore.location=/etc/kafka-tls/keystore.pem
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka-tls/truststore.pem
ssl.endpoint.identification.algorithm=
ssl.client.auth=none
