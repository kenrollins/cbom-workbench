worker_processes 1; pid /run/nginx.pid; error_log /dev/stderr warn;
events { worker_connections 64; }
http { access_log off; server {
  listen 443 ssl; server_name mtls.s2.test;
  ssl_certificate /etc/nginx/tls/c.pem; ssl_certificate_key /etc/nginx/tls/k.pem;
  ssl_protocols TLSv1.2 TLSv1.3; ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
  ssl_client_certificate /etc/nginx/tls/ca.pem; ssl_verify_client on;
  location / { return 200 "mtls\n"; } } }
