site_name: cbom-workbench
site_description: >-
  A cryptography bill of materials, built from wire, host and code evidence, kept on a
  signed ledger and put to work — with the role of AI in that work measured, not assumed.
site_author: Ken Rollins
site_url: !ENV [PQCH_SITE_URL, "https://kenrollins.github.io/cbom-workbench/site/"]
repo_url: https://github.com/kenrollins/cbom-workbench
repo_name: kenrollins/cbom-workbench
copyright: |
  &copy; 2026 Ken Rollins. Apache-2.0. A personal exploration — not an official Dell
  product, reference architecture, or Dell position.
  <a href="https://kenrollins.github.io/cbom-workbench/site/about/">Read the full disclaimer.</a>

# site_src, not docs/: docs/ also holds review artefacts and decisions that
# belong in the repository rather than on a public site. The site build copies
# the journal in, so notes and lessons stay single-sourced.
docs_dir: site_src

theme:
  name: material
  # The header is the demo's own, so the demonstration and the site read as one place.
  custom_dir: site_overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    # The page's own table of contents folds into the left rail.
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["site_src"]
      check_paths: true
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  # The title and logo lead back to the demonstration, not to the site's own front page. In the lab
  # the app serves the demo at / and this site at /site/; a public build sets the Pages path, the
  # mode word, and leaves the lab out.
  homepage: !ENV [PQCH_DEMO_BASE, "/"]
  demo_base: !ENV [PQCH_DEMO_BASE, "/"]
  demo_mode: !ENV [PQCH_DEMO_MODE, "live"]
  lab: !ENV [PQCH_SITE_LAB, "true"]

nav:
  # The demo's pages are in the header, which every page shares; this is the reading beside them.
  - Home: index.md
  - About the demo: demo.md
  - How It Works: how-it-works.md
  - Architecture: architecture.md
  - Hardware: hardware.md
  - Your own network: your-own-network.md
  # >>> generated by tools/build_site.py from docs/journal — do not edit by hand
  - Technical notes:
      - Overview: notes/index.md
      - "00 \u2014 What is the CBOM workbench, and what has it shown so far?": notes/00-what-the-cbom-workbench-is.md
      - "01 \u2014 What is a CBOM, and what is in one?": notes/01-what-is-a-cbom.md
      - "03 \u2014 What does federal policy require, and by when?": notes/03-what-federal-policy-requires-and-when.md
      - "05 \u2014 What can be seen on the wire, on a host and in code \u2014 and what cannot?": notes/05-what-can-be-seen-on-the-wire-host-and-code.md
      - "06 \u2014 How does a finding become a dependency chain?": notes/06-how-a-finding-becomes-a-dependency-chain.md
      - "07 \u2014 How is a migration priority computed?": notes/07-how-a-migration-priority-is-computed.md
      - "08 \u2014 What does \"verified\" mean for a cryptographic change?": notes/08-what-verified-means.md
      - "12 \u2014 What does an auditable record of agent work contain?": notes/12-what-an-auditable-record-contains.md
      - "13 \u2014 Where do language models belong in this pipeline, and where not?": notes/13-where-models-belong.md
      - "15 \u2014 What do the open-source scanners cover, and what is built on top?": notes/15-what-the-open-source-scanners-cover.md
      - "16 \u2014 What does a CBOM make possible once it exists?": notes/16-what-a-cbom-makes-possible.md
      - "17 \u2014 How does a CBOM become a migration plan, and why can't a list of systems?": notes/17-how-a-cbom-becomes-a-migration-plan.md
  - Lessons:
      - Overview: lessons/index.md
      - "01 \u2014 When verifying that a post-quantum key exchange is required, offer every classical group, not the ones the server was configured with": lessons/01-refuse-every-classical-group.md
      - "02 \u2014 Give an isolated Docker network no host address, and test for it": lessons/02-give-an-internal-bridge-no-host-address.md
      - "03 \u2014 Carry a registry in an offline bundle; `docker save` and `docker load` do not preserve digest references": lessons/03-digest-references-need-a-registry.md
      - "04 \u2014 Believe an identity header only on a connection from the proxy that sets it": lessons/04-identity-header-only-from-the-proxy.md
      - "05 \u2014 Score an inventory for what it invents, and put a decoy in every layer it is scored on": lessons/05-penalize-what-an-inventory-invents.md
      - "06 \u2014 Record which container a scan reached, and join evidence only when it is the one you think it is": lessons/06-bind-a-scan-to-what-it-reached.md
      - "07 \u2014 Take the key that verifies a signed log from somewhere other than the log": lessons/07-verification-key-from-outside-the-ledger.md
      - "08 \u2014 Identify a key in an inventory by the hash of its public key, not by where it was found": lessons/08-identify-a-key-by-its-public-key-hash.md
      - "09 \u2014 Time a file scanner on the bare base image first; symlinks, not size, can set its cost": lessons/09-time-a-scanner-on-the-bare-base-image.md
      - "10 \u2014 Count a key-exchange group as accepted only when it is the one negotiated \u2014 and sweep TLS 1.2 groups as TLS 1.2": lessons/10-a-group-is-accepted-when-it-is-negotiated.md
      - "11 \u2014 Prove a passive-monitoring script fires on traffic you generated before reading its silence as absence": lessons/11-check-that-a-monitor-script-fires.md
      - "12 \u2014 Check cited evidence against the question it was meant to answer, then derive the conclusion again": lessons/12-check-evidence-against-the-question.md
      - "13 \u2014 To bound when a logged event happened, sign the log just before it and just after": lessons/13-bracket-an-event-between-two-signatures.md
      - "14 \u2014 Do not switch branches under a running container that bind-mounts the tree; make the health check read the files": lessons/14-do-not-replace-a-bind-mounted-directory.md
      - "15 \u2014 Hash every blob in an offline bundle's registry before serving it, and keep the checksum file's own hash somewhere else": lessons/15-check-a-bundles-blobs-and-anchor-its-checksums.md
      - "16 \u2014 Count a change as applied only when the service answers, and put the old configuration back when it does not": lessons/16-a-service-that-never-listens-is-a-failed-change.md
      - "17 \u2014 In a bundle build, always rebuild what must match the source and record the commit; reuse only what must not change": lessons/17-rebuild-what-must-match-the-source.md
      - "18 \u2014 Observe what a service accepts with nothing configured before planning its migration": lessons/18-observe-a-services-defaults-before-planning-its-change.md
      - "19 \u2014 Label a cause only after changing it and watching the effect go": lessons/19-confirm-a-cause-by-changing-it.md
      - "20 \u2014 Before reading a configuration, know which occurrence of a setting wins in that software": lessons/20-know-each-servers-precedence-rule.md
      - "21 \u2014 Set a floor per role before comparing two models, and repeat every call before believing it": lessons/21-set-a-floor-before-comparing-models.md
      - "22 \u2014 Deploy from a checkout nobody edits": lessons/22-deploy-from-a-checkout-nobody-edits.md
      - "24 \u2014 A hardware label in a config is a claim; record what served the call": lessons/24-a-hardware-label-is-a-claim.md
      - "25 \u2014 Size the scanner network's address range to the parallelism, and record a job that never started as its own failure": lessons/25-size-the-scanner-network-to-the-parallelism.md
      - "26 \u2014 Name the reasoning setting beside the model in every measurement and binding": lessons/26-name-the-reasoning-setting-beside-the-model.md
      - "27 \u2014 Before keying a TLS listener, probe each kind of key exchange on its own: named groups, finite-field DHE, RSA key transport": lessons/27-probe-each-kind-of-key-exchange-on-its-own.md
      - "28 \u2014 Read a certificate's CA flag together with its key usage; a self-signed server certificate is usually marked CA:TRUE": lessons/28-read-a-certificates-ca-flag-with-its-key-usage.md
      - "29 \u2014 Give a listener that carries TLS behind a protocol upgrade its own scan profile; a plain TLS scan of its port is silent, not negative": lessons/29-a-plain-tls-scan-of-an-upgrade-port-is-silent.md
      - "31 \u2014 Confirm every cause an answer key names by changing it, including the ones written as annotations": lessons/31-confirm-an-answer-keys-annotations-the-same-way.md
      - "32 \u2014 Ask the protocol stack's runtime what it will negotiate before calling a migration blocked, or not blocked, by its supplier": lessons/32-ask-the-runtime-what-it-supports.md
      - "33 \u2014 Read a validated module's certificate for the algorithm you need, and check that the module is active, before calling a system validated": lessons/33-read-a-validated-modules-certificate-for-the-algorithm.md
      - "34 \u2014 Score the retrieval step on its own before scoring a model's answer over it": lessons/34-score-retrieval-before-the-answer.md
      - "35 \u2014 Compare two inventories by the identity of each observation and by what it says, leaving out references to the records behind it": lessons/35-compare-inventories-by-what-they-say.md
      - "36 \u2014 When verifying that a listener requires post-quantum key establishment, probe TLS 1.2 on its own; a classical-only TLS 1.3 client is refused, not downgraded": lessons/36-probe-tls-1-2-apart-when-requiring-post-quantum.md
      - "37 \u2014 When a probe claims a handshake the enumerating witness does not find, call the verdict inconclusive and say why; neither side settles it": lessons/37-a-contradiction-between-two-witnesses-is-inconclusive.md
      - "38 \u2014 Before citing or redrawing a standard, read its status on the publisher's page; cite the current revision by its own identifier": lessons/38-read-a-standards-status-before-citing-it.md
      - "39 \u2014 Every label in a diagram of what a system does is a claim; fill it from the record and check each against the record before it is shown": lessons/39-a-diagrams-labels-are-claims.md
      - "40 \u2014 Draw a cryptographic inventory in columns along its dependency chain, not as a force-directed graph": lessons/40-draw-an-inventory-along-its-chain.md
      - "41 \u2014 Before approving a change that requires post-quantum key establishment, probe each kind of client against a copy with the change; enforced says it landed, not whom it refuses": lessons/41-before-requiring-probe-who-it-shuts-out.md
      - "42 \u2014 Before trusting a discovery tool's silence, show it something it should find; an empty result is a finding about the tool until then": lessons/42-show-a-tool-what-it-should-find-before-trusting-its-silence.md
      - "43 \u2014 Report a change's time from approval to proof beside its time from policy to proof; the gap is the wait for a person, not the system": lessons/43-report-the-machines-time-apart-from-the-wait-for-a-person.md
      - "44 \u2014 Publish a curated export, checked for leaks, not the working repository; and keep the list of what must not leak out of the published tools": lessons/44-publish-a-curated-export-not-the-working-repository.md
  # <<< end generated
  - Sources: sources.md
  - About: about.md
