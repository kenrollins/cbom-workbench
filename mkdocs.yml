      - "06 \u2014 How does a finding become a dependency chain?": notes/06-how-a-finding-becomes-a-dependency-chain.md
      - "07 \u2014 How is a migration priority computed?": notes/07-how-a-migration-priority-is-computed.md
      - "08 \u2014 What does \"verified\" mean for a cryptographic change?": notes/08-what-verified-means.md
      - "12 \u2014 What does an auditable record of agent work contain?": notes/12-what-an-auditable-record-contains.md
      - "13 \u2014 Where do language models belong in this pipeline, and where not?": notes/13-where-models-belong.md
      - "15 \u2014 What do the open-source scanners cover, and what is built on top?": notes/15-what-the-open-source-scanners-cover.md
