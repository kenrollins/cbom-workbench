      - "52 \u2014 An inventory read as an ordinary user must list every path it could not open, and the plan must carry the privileged read as a step": lessons/52-a-read-without-privileges-must-list-what-it-could-not-open.md
      - "53 \u2014 An offline install carries the build backend with the wheelhouse and installs outside the lock file; nothing in the runbook calls the package manager's run command": lessons/53-carry-the-build-backend-and-install-offline-outside-the-lock.md
      - "54 \u2014 When a box already serves the engines on its loopback, join their containers to the kit's bridge under the kit's names instead of starting them again": lessons/54-join-the-boxs-own-engines-to-the-kits-bridge-under-the-kits-names.md
      - "55 \u2014 A reply cap on a thinking tier is a thinking budget: set it from the measured tokens of the role's hardest items, and record a cut-off as an empty reply": lessons/55-a-reply-cap-on-a-thinking-tier-is-a-thinking-budget.md
