      - "63 \u2014 A static copy of a page whose answer comes from a model shows a call made once and labelled, offers only the questions recorded, and runs the rule's check again where it is built": lessons/63-a-static-copy-of-a-model-page-shows-a-recorded-call-and-checks-it-again.md
