      - "57 \u2014 When two renderers must show the same header, give them one stylesheet and one markup shape, copied at build time; a second implementation that matches by description drifts": lessons/57-render-a-shared-header-from-one-file.md
      - "58 \u2014 A model whose chat template thinks by default must be told not to on every plain call, and its reply's shape belongs in the prompt and a validator, not in the engine's grammar": lessons/58-a-thinking-template-must-be-told-not-to-think.md
      - "59 \u2014 Serve a static site that is rebuilt in place with Cache-Control: no-cache; without it the browser keeps old pages for a tenth of their age": lessons/59-serve-a-rebuilt-static-site-with-no-cache.md
      - "60 \u2014 Before a component goes in an architecture picture, find the line of code that calls it; a stack drawn from what the box has installed claims parts the system never uses": lessons/60-before-a-component-goes-in-a-picture-find-its-call-site.md
