site_name: cbom-workbench
site_description: >-
  A cryptography bill of materials, built from wire, host and code evidence, kept on a
  signed ledger and put to work — with the role of AI in that work measured, not assumed.
site_author: Ken Rollins
site_url: !ENV [PQCH_SITE_URL, "https://kenrollins.github.io/cbom-workbench/site/"]
repo_url: https://github.com/kenrollins/cbom-workbench
repo_name: kenrollins/cbom-workbench
copyright: |
  &copy; 2026 Ken Rollins. Apache-2.0. A personal exploration — not an official Dell
  product, reference architecture, or Dell position.
  <a href="https://kenrollins.github.io/cbom-workbench/site/about/">Read the full disclaimer.</a>

# site_src, not docs/: docs/ also holds review artefacts and decisions that
# belong in the repository rather than on a public site. The site build copies
# the journal in, so notes and lessons stay single-sourced.
docs_dir: site_src

theme:
  name: material
  # The header is the demo's own, so the demonstration and the site read as one place.
  custom_dir: site_overrides
  # One scheme, no toggle: the field notes are the book, open on a desk (stylesheets/fieldnotes.css).
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    # The page's own table of contents folds into the left rail.
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  font: false   # vendored in stylesheets/fonts/: Jost (display), Inter (body), JetBrains Mono, Caveat (hand)

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["site_src"]
      check_paths: true
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

extra_css:
  - stylesheets/header.css       # the demo's header, copied in by tools/build_site.py
  - stylesheets/fieldnotes.css   # the little brown book — shared with the lab's other field-notes sites
  - stylesheets/extra.css        # this site's own
  - stylesheets/drawings.css     # sketches (tools/draw.py, when a note carries one)

extra:
  # The title and logo lead back to the demonstration, not to the site's own front page. In the lab
  # the app serves the demo at / and this site at /site/; a public build sets the Pages path, the
  # mode word, and leaves the lab out.
  homepage: !ENV [PQCH_DEMO_BASE, "/"]
  demo_base: !ENV [PQCH_DEMO_BASE, "/"]
  demo_mode: !ENV [PQCH_DEMO_MODE, "live"]
  lab: !ENV [PQCH_SITE_LAB, "true"]
  # First entry → latest entry, written by tools/build_site.py from the journal's frontmatter dates.
  journal_span: "Oct 4 → Nov 8, 2026"   # >>> generated

nav:
  # The demo's pages are in the header, which every page shares; this is the reading beside them.
  - Home: index.md
  - About the demo: demo.md
  - Page by page: pages.md
  - The record: record.md
  - How It Works: how-it-works.md
  - Architecture: architecture.md
  - Hardware: hardware.md
  - Your own network: your-own-network.md
  - Data handling: data-handling.md
  - Model role cards: role-cards.md
  # >>> generated by tools/build_site.py from docs/adr and docs/journal — do not edit by hand
  - Decisions:
      - Overview: adr/index.md
      - "01 \u2014 The ledger is the system of record; the CBOM is built from it": adr/0001-the-ledger-is-the-system-of-record.md
      - "02 \u2014 Two targets, one codebase": adr/0002-two-targets-one-codebase.md
      - "03 \u2014 Deployment shapes \u2014 where the harness runs and where the estate lives": adr/0003-deployment-shapes.md
      - "04 \u2014 One deployment, in the lab; the bundle is a feature, not a target": adr/0004-one-deployment-in-the-lab.md
      - "05 \u2014 A server is an estate \u2014 its listeners, its files, its firmware and its controller, recorded and replayable": adr/0005-a-server-is-an-estate.md
      - "06 \u2014 The public site is a recording, a record and notes, never a facsimile of the running workbench": adr/0006-the-public-site-is-a-recording-a-record-and-notes.md
  - Technical notes:
